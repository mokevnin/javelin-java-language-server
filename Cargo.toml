[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/protocol",
    "crates/document",
    "crates/parser",
    "crates/semantic",
    "crates/index",
    "crates/classpath",
    "crates/build",
    "crates/server",
    "crates/cli",
    "crates/wasm",
    "benchmarks",
    "tests",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Mike2306/javelin-java-language-server"
authors = ["Javelin contributors"]

[workspace.dependencies]
javelin-core = { path = "crates/core" }
javelin-protocol = { path = "crates/protocol" }
javelin-document = { path = "crates/document" }
javelin-parser = { path = "crates/parser" }
javelin-semantic = { path = "crates/semantic" }
javelin-index = { path = "crates/index" }
javelin-classpath = { path = "crates/classpath" }
javelin-build = { path = "crates/build" }
javelin-server = { path = "crates/server" }

# Shared third-party versions. Pin here so all crates move together.
anyhow = "1.0"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
# `deflate` resolves to zlib-rs, a pure-Rust zlib reimplementation — not a C
# binding — so no zlib/C toolchain is needed on any of the three CI platforms.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
# Startup latency is a product requirement: fat LTO + one codegen unit measurably
# shrinks the binary and cuts process start time. Keep debug symbols for profiling.
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "none"

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16

# Benchmarks and tests are unusably slow with an unoptimized tree-sitter.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
